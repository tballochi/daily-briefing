name: Daily Tech Briefing

# Sends the briefing every morning in the 07:00-09:59 Europe/Paris window (target ~9am,
# earlier is fine — the goal is that it goes out every single morning before 10:00).
#
# GitHub cron is UTC, has no timezone support, and is unreliable on the hour (the shared
# scheduler is overloaded at :00 and frequently delays or drops those runs). So we fire
# MANY times on off-peak minutes across the window; the first trigger that GitHub
# actually runs sends the briefing, and the once-a-day idempotency guard makes every
# later trigger a no-op. A missed/dropped trigger is always caught by the next one.

on:
  schedule:
    # :11, :33, :55 past UTC 05-08 -> lands inside Paris 07:00-09:59 in both DST seasons.
    - cron: "11,33,55 5,6,7,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can rebase before pushing the updated state

      - name: Gate (manual = force; scheduled = only in the 07-09 Paris window)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> force."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Europe/Paris date +%H)
            echo "Current Paris hour: $H"
            case "$H" in
              07|08|09) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send briefing
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py --now ${{ steps.gate.outputs.force }}

      - name: Commit updated history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --quiet --cached; then
            echo "No history change to commit."
            exit 0
          fi
          git commit -m "chore: update article history [skip ci]"
          # The runner can be behind origin/main (concurrent triggers, code pushes),
          # which makes a plain push fail with "fetch first". Rebase onto the latest
          # main and retry a few times so the state always lands.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed history on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest origin/main."
            git fetch origin main
            git rebase origin/main || {
              # history.json is single-writer; on the rare conflict, keep our newer state.
              git checkout --theirs data/history.json || true
              git add data/history.json
              git rebase --continue || git rebase --abort
            }
            sleep 3
          done
          echo "::error::Failed to push updated history after 5 attempts."
          exit 1
