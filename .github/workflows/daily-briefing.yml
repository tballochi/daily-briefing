name: Daily Tech Briefing

# Sends the briefing every morning around 09:00 Europe/Paris.
# GitHub cron is UTC with no timezone support and can be delayed, so we fire several
# times across the morning and let a guard keep only the 9-11 Paris window. The job
# is idempotent (one send per Paris day), so extra triggers never double-send.

on:
  schedule:
    - cron: "0 7 * * *"   # 09:00 Paris (summer) / 08:00 Paris (winter)
    - cron: "0 8 * * *"   # 10:00 Paris (summer) / 09:00 Paris (winter)
    - cron: "0 9 * * *"   # 11:00 Paris (summer) / 10:00 Paris (winter)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gate (manual = force; scheduled = only in the 09-11 Paris window)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> force."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Europe/Paris date +%H)
            echo "Current Paris hour: $H"
            case "$H" in
              09|10|11) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send briefing
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py --now ${{ steps.gate.outputs.force }}

      - name: Commit updated history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --quiet --cached; then
            echo "No history change to commit."
          else
            git commit -m "chore: update article history [skip ci]"
            git push
          fi
