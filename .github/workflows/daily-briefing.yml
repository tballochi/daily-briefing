name: Daily Tech Briefing

# Sends the briefing every morning around 09:00 Europe/Paris.
# GitHub cron is UTC with no timezone support and is unreliable on the hour (the shared
# scheduler is overloaded at :00 and often delays or drops those runs). So we fire on an
# off-peak minute, several times across the morning, and a guard keeps only the 9-11
# Paris window. The job is idempotent (one send per Paris day), so extra triggers never
# double-send and a missed first trigger is caught by a later one.

on:
  schedule:
    - cron: "17 6,7,8,9 * * *"   # :17 past 06-09 UTC -> covers 09/10/11 Paris in both DST seasons
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can rebase before pushing the updated state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gate (manual = force; scheduled = only in the 09-11 Paris window)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> force."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Europe/Paris date +%H)
            echo "Current Paris hour: $H"
            case "$H" in
              09|10|11) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send briefing
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py --now ${{ steps.gate.outputs.force }}

      - name: Commit updated history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --quiet --cached; then
            echo "No history change to commit."
            exit 0
          fi
          git commit -m "chore: update article history [skip ci]"
          # The runner can be behind origin/main (concurrent triggers, code pushes),
          # which makes a plain push fail with "fetch first". Rebase onto the latest
          # main and retry a few times so the state always lands.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed history on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest origin/main."
            git fetch origin main
            git rebase origin/main || {
              # history.json is single-writer; on the rare conflict, keep our newer state.
              git checkout --theirs data/history.json || true
              git add data/history.json
              git rebase --continue || git rebase --abort
            }
            sleep 3
          done
          echo "::error::Failed to push updated history after 5 attempts."
          exit 1
